<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>MR · 更新日志与下载</title>
  <meta name="description" content="MR（Mineradio）最新版本、更新说明与网盘下载入口。">
  <style>
    :root {
      color-scheme: dark;
      --bg: #07090c;
      --card: rgba(255, 255, 255, .045);
      --line: rgba(255, 255, 255, .10);
      --text: rgba(255, 255, 255, .92);
      --muted: rgba(255, 255, 255, .56);
      --faint: rgba(255, 255, 255, .34);
      --accent: #f4d28a;
      --accent-soft: rgba(244, 210, 138, .12);
      --danger: #ff9b9b;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      background:
        radial-gradient(900px 520px at 12% -8%, rgba(244, 210, 138, .10), transparent 62%),
        radial-gradient(760px 480px at 96% 4%, rgba(126, 231, 210, .07), transparent 60%),
        var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei UI", "PingFang SC", "Segoe UI", system-ui, -apple-system, sans-serif;
      font-size: 16px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 40px 20px 56px;
    }

    .hero { margin-bottom: 22px; }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid rgba(244, 210, 138, .38);
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .06em;
    }

    .brand-text {
      font-size: 11px;
      letter-spacing: .34em;
      color: var(--muted);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(26px, 5vw, 34px);
      line-height: 1.25;
      font-weight: 650;
      letter-spacing: .01em;
    }

    .hero-sub {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .card {
      margin-top: 16px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--card);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: 13px;
      font-weight: 650;
      letter-spacing: .14em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .version-line {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 10px 14px;
    }

    .version-label {
      font-size: 11px;
      letter-spacing: .18em;
      color: var(--faint);
    }

    .version-number {
      font-size: clamp(30px, 7vw, 42px);
      line-height: 1.1;
      font-weight: 700;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      letter-spacing: .01em;
    }

    .version-date {
      font-size: 12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .version-state {
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
    }

    .version-state.is-error { color: var(--danger); }

    .notes {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 9px;
    }

    .notes li {
      position: relative;
      padding-left: 18px;
      color: rgba(255, 255, 255, .78);
      font-size: 13px;
      word-break: break-word;
    }

    .notes li::before {
      content: "";
      position: absolute;
      left: 2px;
      top: .72em;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(244, 210, 138, .55);
    }

    .notes li.muted { color: var(--faint); }
    .notes li.muted::before { background: rgba(255, 255, 255, .18); }

    .hint {
      margin: -4px 0 14px;
      font-size: 12px;
      color: var(--faint);
    }

    .downloads {
      display: grid;
      gap: 10px;
    }

    .download-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 255, 255, .025);
    }

    .download-meta {
      min-width: 0;
      display: grid;
      gap: 3px;
    }

    .download-name {
      font-size: 13.5px;
      font-weight: 600;
      color: rgba(255, 255, 255, .9);
    }

    .download-code {
      font-size: 11.5px;
      color: var(--faint);
      word-break: break-all;
    }

    .download-code b {
      color: var(--accent);
      font-weight: 600;
      letter-spacing: .06em;
    }

    .download-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 34px;
      padding: 0 14px;
      border-radius: 9px;
      border: 1px solid rgba(244, 210, 138, .40);
      background: var(--accent-soft);
      color: var(--accent);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: background .15s ease, color .15s ease, border-color .15s ease;
      white-space: nowrap;
    }

    .btn:hover { background: rgba(244, 210, 138, .20); color: #fff; }

    .btn.ghost {
      border-color: var(--line);
      background: transparent;
      color: var(--muted);
      font-weight: 500;
    }

    .btn.ghost:hover { background: rgba(255, 255, 255, .07); color: #fff; }

    .btn[aria-disabled="true"] {
      opacity: .45;
      pointer-events: none;
    }

    .retry {
      margin-top: 12px;
    }

    .empty {
      padding: 6px 0 2px;
      color: var(--faint);
      font-size: 12.5px;
    }

    .group-line {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      font-size: 12.5px;
      color: var(--muted);
    }

    .group-line[hidden] { display: none; }

    .group-line b {
      color: var(--text);
      font-weight: 600;
      letter-spacing: .04em;
    }

    .group-copy {
      margin-left: auto;
      height: 30px;
      padding: 0 12px;
      font-size: 12px;
    }

    .foot {
      margin-top: 26px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
      font-size: 11.5px;
      color: var(--faint);
    }

    .hero-sub, .hint, .version-label, .version-date, .version-state,
    .download-code, .group-line, .foot, .brand-text, .btn, .group-copy {
      font-size: 14px;
    }
    button, a { touch-action: manipulation; }
    .btn { min-height: 44px; }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    .download-row { min-width: 0; }
    .download-meta { overflow-wrap: anywhere; }

    @media (max-width: 560px) {
      .page { padding: 28px 14px 44px; }
      .card { padding: 16px; border-radius: 14px; }
      .download-row { flex-direction: column; align-items: stretch; }
      .download-actions { justify-content: flex-end; }
      .foot { flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">MR</span>
        <span class="brand-text">MR · MINERADIO</span>
      </div>
      <h1>更新日志与下载</h1>
      <p class="hero-sub">MR 最新版本、更新说明，以及各网盘下载入口。</p>
    </header>

    <section class="card" aria-live="polite">
      <div class="version-line">
        <span class="version-label">最新版本</span>
        <strong class="version-number" id="version">—</strong>
        <span class="version-date" id="date"></span>
      </div>
      <div class="version-state" id="state">正在读取更新信息…</div>
    </section>

    <section class="card">
      <h2>更新说明</h2>
      <ul class="notes" id="notes">
        <li class="muted">加载中…</li>
      </ul>
    </section>

    <section class="card">
      <h2>下载</h2>
      <p class="hint">点「打开网盘」跳转到对应网盘；带提取码的条目可一键复制。</p>
      <div class="downloads" id="downloads">
        <div class="empty">加载中…</div>
      </div>
      <div class="group-line" id="group-line" hidden>
        <span>交流群</span>
        <b id="group-number"></b>
        <button type="button" class="btn ghost group-copy" id="group-copy">复制群号</button>
      </div>
    </section>

    <footer class="foot">
      <span>MR · 更新与下载</span>
      <span id="foot-meta"></span>
    </footer>
  </main>

  <script>
    (function () {
      'use strict';

      var versionEl = document.getElementById('version');
      var dateEl = document.getElementById('date');
      var stateEl = document.getElementById('state');
      var notesEl = document.getElementById('notes');
      var downloadsEl = document.getElementById('downloads');
      var footMetaEl = document.getElementById('foot-meta');
      var groupLineEl = document.getElementById('group-line');
      var groupNumberEl = document.getElementById('group-number');
      var groupCopyEl = document.getElementById('group-copy');
      var qqGroup = '';

      if (groupCopyEl) {
        groupCopyEl.addEventListener('click', function () {
          if (!qqGroup) return;
          copyText(qqGroup).then(function () {
            groupCopyEl.textContent = '已复制';
            setTimeout(function () { groupCopyEl.textContent = '复制群号'; }, 1600);
          }).catch(function () {
            groupCopyEl.textContent = '复制失败';
            setTimeout(function () { groupCopyEl.textContent = '复制群号'; }, 1600);
          });
        });
      }

      // 网盘链接只接受 HTTPS，避免配置里被塞入 javascript: 之类的地址
      function safeHttpsUrl(value) {
        try {
          var url = new URL(String(value || ''));
          return url.protocol === 'https:' && url.hostname && !url.username && !url.password ? url.href : '';
        } catch (_) {
          return '';
        }
      }

      function setState(text, isError) {
        stateEl.textContent = text || '';
        stateEl.classList.toggle('is-error', isError === true);
      }

      function clearNode(node) {
        while (node.firstChild) node.removeChild(node.firstChild);
      }

      function renderNotes(notes) {
        clearNode(notesEl);
        var list = Array.isArray(notes) ? notes : String(notes || '').split('\n');
        list = list.map(function (item) { return String(item == null ? '' : item).trim(); }).filter(Boolean);
        if (!list.length) {
          var empty = document.createElement('li');
          empty.className = 'muted';
          empty.textContent = '本次更新没有填写说明。';
          notesEl.appendChild(empty);
          return;
        }
        list.forEach(function (text) {
          var li = document.createElement('li');
          li.textContent = text;
          notesEl.appendChild(li);
        });
      }

      function copyText(text) {
        if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
          return navigator.clipboard.writeText(text);
        }
        return new Promise(function (resolve, reject) {
          try {
            var input = document.createElement('textarea');
            input.value = text;
            input.setAttribute('readonly', 'readonly');
            input.style.position = 'fixed';
            input.style.opacity = '0';
            document.body.appendChild(input);
            input.select();
            var ok = document.execCommand('copy');
            document.body.removeChild(input);
            ok ? resolve() : reject(new Error('COPY_FAILED'));
          } catch (error) {
            reject(error);
          }
        });
      }

      function makeCopyButton(code) {
        var button = document.createElement('button');
        button.type = 'button';
        button.className = 'btn ghost';
        button.textContent = '复制提取码';
        button.addEventListener('click', function () {
          copyText(code).then(function () {
            button.textContent = '已复制';
            setTimeout(function () { button.textContent = '复制提取码'; }, 1600);
          }).catch(function () {
            button.textContent = '复制失败';
            setTimeout(function () { button.textContent = '复制提取码'; }, 1600);
          });
        });
        return button;
      }

      function renderDownloads(downloads) {
        clearNode(downloadsEl);
        var list = Array.isArray(downloads) ? downloads : [];
        if (!list.length) {
          var empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = '暂未配置下载入口，请稍后再来。';
          downloadsEl.appendChild(empty);
          return;
        }
        list.forEach(function (item) {
          if (!item || typeof item !== 'object') return;
          var row = document.createElement('div');
          row.className = 'download-row';

          var meta = document.createElement('div');
          meta.className = 'download-meta';
          var name = document.createElement('div');
          name.className = 'download-name';
          name.textContent = String(item.name || '网盘下载');
          meta.appendChild(name);

          var code = String(item.code || '').trim();
          if (code) {
            var codeLine = document.createElement('div');
            codeLine.className = 'download-code';
            codeLine.appendChild(document.createTextNode('提取码 '));
            var bold = document.createElement('b');
            bold.textContent = code;
            codeLine.appendChild(bold);
            meta.appendChild(codeLine);
          }

          var actions = document.createElement('div');
          actions.className = 'download-actions';

          var href = safeHttpsUrl(item.url);
          var link = document.createElement('a');
          link.className = 'btn';
          link.textContent = '打开网盘';
          link.href = href || '#';
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          if (!href) {
            link.setAttribute('aria-disabled', 'true');
            link.removeAttribute('href');
            link.textContent = '链接待补充';
          }
          actions.appendChild(link);

          if (code) actions.appendChild(makeCopyButton(code));

          row.appendChild(meta);
          row.appendChild(actions);
          downloadsEl.appendChild(row);
        });
      }

      function showLoadFailure(error) {
        setState('更新信息加载失败，请稍后刷新重试。', true);
        if (groupLineEl) groupLineEl.hidden = true;
        clearNode(notesEl);
        var li = document.createElement('li');
        li.className = 'muted';
        li.textContent = '暂时无法读取版本信息。';
        notesEl.appendChild(li);
        clearNode(downloadsEl);
        var box = document.createElement('div');
        box.className = 'empty';
        box.textContent = '暂时无法读取下载列表。';
        downloadsEl.appendChild(box);
        var retry = document.createElement('button');
        retry.type = 'button';
        retry.className = 'btn ghost retry';
        retry.textContent = '重新加载';
        retry.addEventListener('click', function () { load(); });
        downloadsEl.appendChild(retry);
        console.warn('[update-site] load failed:', error);
      }

      function applyRelease(data) {
        var version = String(data.version || '').trim();
        if (!/^v?(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:\.(0|[1-9]\d*))?(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/i.test(version)) throw new Error('INVALID_RELEASE_VERSION');
        var date = String(data.date || '').trim();
        versionEl.textContent = version ? 'v' + version.replace(/^v/i, '') : '—';
        dateEl.textContent = date ? '发布于 ' + date : '';
        setState('更新信息读取成功。', false);
        renderNotes(data.notes);
        renderDownloads(data.downloads);
        qqGroup = String(data.qqGroup || '').trim();
        if (groupLineEl) groupLineEl.hidden = !qqGroup;
        if (groupNumberEl) groupNumberEl.textContent = qqGroup ? 'Q群 ' + qqGroup : '';
        footMetaEl.textContent = version ? '最新版本 v' + version.replace(/^v/i, '') : '';
      }

      function load() {
        setState('正在读取更新信息…', false);
        var controller = new AbortController();
        var timer = setTimeout(function () { controller.abort(); }, 10000);
        // 用相对路径，部署到 GitHub Pages 子目录时无需改这里
        return fetch('release.json?t=' + Date.now(), { cache: 'no-store', signal: controller.signal })
          .then(function (response) {
            if (!response.ok) throw new Error('HTTP ' + response.status);
            return response.json();
          })
          .then(function (data) {
            if (!data || typeof data !== 'object') throw new Error('INVALID_RELEASE_JSON');
            applyRelease(data);
          })
          .catch(showLoadFailure)
          .finally(function () { clearTimeout(timer); });
      }

      load();
    })();
  </script>
</body>
</html>
